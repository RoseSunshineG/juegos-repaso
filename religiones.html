<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Religió · El Tren de les Religions</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen game — track with train on top, question card, big answer buttons below */
:root{
  --bg:#eef5f1; --panel:#ffffff; --fg:#1f2d2a; --muted:#5d6f6a; --line:#cfded8;
  --rail:#7a5a3c; --accent:#e4572e; --ok:#2e9e5b; --bad:#d64045;
  --jud:#2f6fd6; --cri:#8a4fbf; --isl:#1f9a6b; --hin:#e98a15; --bud:#c9a20e;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14201d; --panel:#1d2c28; --fg:#eaf3ef; --muted:#9db3ac; --line:#2f433d; --rail:#b48a62;
  --jud:#5b93f0; --cri:#b07de0; --isl:#3cc28e; --hin:#f5a33d; --bud:#e6c23a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14201d; --panel:#1d2c28; --fg:#eaf3ef; --muted:#9db3ac; --line:#2f433d; --rail:#b48a62;
  --jud:#5b93f0; --cri:#b07de0; --isl:#3cc28e; --hin:#f5a33d; --bud:#e6c23a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0;font-weight:700;text-wrap:balance}
.score{font-weight:600;font-variant-numeric:tabular-nums;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px}
.tabs{display:flex;gap:8px}
.tab{font:inherit;font-size:.95rem;font-weight:600;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:6px 12px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* track */
.track{position:relative;height:84px;background:var(--panel);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.rails{position:absolute;left:10px;right:10px;bottom:16px;height:10px;
  background:repeating-linear-gradient(90deg,var(--rail) 0 6px,transparent 6px 22px);}
.rails::before,.rails::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--rail)}
.rails::before{top:0}.rails::after{bottom:0}
.station{position:absolute;right:10px;bottom:28px;font-size:.75rem;font-weight:700;letter-spacing:.05em;color:var(--muted);text-align:center;line-height:1.1}
.station b{display:block;font-size:1.6rem;line-height:1}
.train{position:absolute;bottom:24px;left:6px;transition:left .7s cubic-bezier(.4,1.6,.5,1);width:96px}
@media (prefers-reduced-motion:reduce){.train{transition:none}}
/* card */
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.cat{font-size:.85rem;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.q{font-size:1.15rem;font-weight:500;margin:0}
.word{font-size:2rem;font-weight:700;margin:4px 0;line-height:1.1;text-wrap:balance}
.fb{min-height:1.6em;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{font:inherit;font-size:1.1rem;font-weight:600;border:3px solid var(--c,var(--line));background:var(--panel);color:var(--fg);
  border-radius:16px;padding:12px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:62px;text-align:center}
.ans .ic{font-size:1.6rem;color:var(--c,var(--fg));line-height:1}
.ans:last-child:nth-child(odd){grid-column:1/-1}
.ans:focus-visible,.tab:focus-visible,.big:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ans.right{background:var(--ok);border-color:var(--ok);color:#fff}.ans.right .ic{color:#fff}
.ans.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .4s}.ans.wrong .ic{color:#fff}
.ans:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{font:inherit;font-size:1.2rem;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:14px 22px;cursor:pointer}
/* review table */
.tablebox{overflow-x:auto;background:var(--panel);border:2px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
thead th{color:#fff;font-weight:700}
tbody th{text-align:left;color:var(--muted);font-size:.8rem;letter-spacing:.08em}
td.hide{color:transparent;background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px);cursor:pointer;border-radius:6px}
.hint{color:var(--muted);font-size:.95rem;margin:0;text-align:center}
.end{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.stars{font-size:2.4rem;letter-spacing:4px;color:var(--bud)}

/* ===== Vagons ===== */
:root{--dock:#e4ece6}

/* Layout: station with 5 platforms (one train per religion) stacked; cargo cards sit on the loading dock below */







.pill{font-weight:600;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.round{display:flex;gap:6px;flex-wrap:wrap}
.rb{font:inherit;font-size:.85rem;font-weight:600;letter-spacing:.06em;border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:5px 10px;cursor:pointer}
.rb.done{color:var(--ok);border-color:var(--ok)}
.rb[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.task{margin:0;font-size:1.1rem;text-align:center}
.task b{color:var(--accent)}
/* platforms */
.vstation{display:flex;flex-direction:column;gap:8px}
.plat{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 10px 18px;overflow:hidden;
  display:flex;align-items:center;gap:8px;min-height:64px;transition:border-color .2s,background .2s}
.plat.hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.plat.pick{cursor:pointer}
.plat::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:5px;
  background:repeating-linear-gradient(90deg,var(--rail) 0 4px,transparent 4px 14px);border-top:2px solid var(--rail)}
.loco{flex:none;width:58px;height:40px;position:relative}
.loco .body{position:absolute;inset:10px 0 0 0;background:var(--c);border-radius:6px 10px 4px 4px}
.loco .cab{position:absolute;left:0;top:0;width:24px;height:22px;background:var(--c);border-radius:4px}
.loco .ic{position:absolute;inset:10px 0 0 22px;display:grid;place-items:center;color:#fff;font-size:1.3rem;line-height:1}
.name{flex:none;width:96px;font-weight:700;font-size:.95rem;color:var(--c);line-height:1.1}
.wagons{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.wagon{border:2px dashed var(--c);border-radius:8px;padding:4px 8px;font-size:.85rem;font-weight:600;min-width:56px;min-height:30px;display:flex;align-items:center;color:var(--muted)}
.wagon.full{border-style:solid;background:var(--c);color:#fff}
.plat.go .loco,.plat.go .name,.plat.go .wagons{transform:translateX(120vw);transition:transform 1.6s cubic-bezier(.5,0,.8,.4)}
@media (prefers-reduced-motion:reduce){.plat.go .loco,.plat.go .name,.plat.go .wagons{transition:none}}
/* dock */
.dock{background:var(--dock);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:72px}
.crate{font:inherit;font-size:1.15rem;font-weight:600;background:var(--panel);color:var(--fg);border:3px solid var(--fg);border-radius:12px;
  padding:10px 16px;cursor:grab;touch-action:none;box-shadow:0 3px 0 var(--fg)}
.crate.sel{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.crate.drag{position:fixed;z-index:20;pointer-events:none;cursor:grabbing;transform:rotate(-4deg) scale(1.06)}
.crate.ghost{opacity:.25}
.crate.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.crate:focus-visible,.rb:focus-visible,.vbig:focus-visible,.plat:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vfb{min-height:1.5em;text-align:center;font-weight:600;margin:0}
.vfb.ok{color:var(--ok)}.vfb.bad{color:var(--bad)}
.vbig{font:inherit;font-size:1.2rem;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:14px 22px;cursor:pointer;align-self:center}
.help{color:var(--muted);font-size:.9rem;text-align:center;margin:0}
@media (max-width:520px){.name{display:none}.loco{width:48px}}

.vtop{display:flex;justify-content:flex-end}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>🚂 Religió</h1>
    <div class="tabs">
      <button class="tab" id="tab-joc" aria-pressed="true">Jugar</button>
      <button class="tab" id="tab-vag" aria-pressed="false">Vagons</button>
      <button class="tab" id="tab-taula" aria-pressed="false">Repassar</button>
    </div>
  </header>

  <section id="joc">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="track" aria-hidden="true">
        <div class="rails"></div>
        <div class="station"><b>⚑</b>ESTACIÓ</div>
        <svg class="train" id="train" viewBox="0 0 96 44">
          <rect x="4" y="12" width="40" height="22" rx="4" fill="var(--accent)"/>
          <rect x="30" y="2" width="14" height="14" rx="2" fill="var(--accent)"/>
          <rect x="33" y="5" width="8" height="7" rx="1" fill="var(--panel)"/>
          <rect x="10" y="4" width="8" height="10" rx="1" fill="var(--fg)"/>
          <rect x="50" y="16" width="40" height="18" rx="4" fill="var(--isl)"/>
          <rect x="44" y="24" width="6" height="3" fill="var(--fg)"/>
          <circle cx="14" cy="36" r="6" fill="var(--fg)"/><circle cx="34" cy="36" r="6" fill="var(--fg)"/>
          <circle cx="60" cy="36" r="6" fill="var(--fg)"/><circle cx="80" cy="36" r="6" fill="var(--fg)"/>
        </svg>
      </div>
      <div class="score" id="score" style="align-self:center">Pregunta 1 de 10 · ★ 0</div>
      <div id="stage"></div>
    </div>
  </section>

  <section id="vag" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="vtop"><span class="pill" id="vScore">★ 0</span></div>
  <nav class="round" id="vRounds" aria-label="Rondes"></nav>
  <p class="task" id="vTask"></p>
  <div class="vstation" id="vStation"></div>
  <p class="vfb" id="vFb"></p>
  <div class="dock" id="vDock"></div>
  <p class="help">Arrossega cada caixa fins al seu tren, o toca la caixa i després el tren.</p>
    </div>
  </section>

  <section id="taula" hidden>
    <div style="display:flex;flex-direction:column;gap:10px">
      <p class="hint">Toca els quadres ratllats per descobrir la resposta. Intenta dir-la abans!</p>
      <div class="tablebox"><table id="tbl"></table></div>
      <button class="big" id="tapa" style="align-self:center">Tapar-ho tot</button>
    </div>
  </section>
</div>

<script>
const R=[
 {id:"jud",nom:"Judaisme",ic:"✡",c:"var(--jud)"},
 {id:"cri",nom:"Cristianisme",ic:"✝",c:"var(--cri)"},
 {id:"isl",nom:"Islam",ic:"☪",c:"var(--isl)"},
 {id:"hin",nom:"Hinduisme",ic:"ॐ",c:"var(--hin)"},
 {id:"bud",nom:"Budisme",ic:"☸",c:"var(--bud)"}
];
const CATS=[
 {k:"simbol",nom:"SÍMBOL",q:"Quin és el símbol"},
 {k:"temple",nom:"TEMPLE",q:"On preguen? Quin és el temple"},
 {k:"festa",nom:"FESTA",q:"Quina és la festa"},
 {k:"ritu",nom:"RITU",q:"Quin és el ritu"},
 {k:"pers",nom:"PERSONATGE IMPORTANT",q:"Qui és el personatge important"}
];
const D={
 jud:{simbol:"Menorà",temple:"Sinagoga",festa:"Pésah",ritu:"Rentar-se les mans",pers:"Moisès"},
 cri:{simbol:"Creu",temple:"Església",festa:"Nadal",ritu:"Eucaristia",pers:"Jesús"},
 isl:{simbol:"Mitja lluna i estel",temple:"Mesquita",festa:"Festa del Xai",ritu:"Salat",pers:"Mahoma"},
 hin:{simbol:"Om",temple:"Temple hindú",festa:"Diwali",ritu:"Ofrena a les divinitats",pers:null},
 bud:{simbol:"Roda del Dharma",temple:"Temple budista",festa:"Vesak",ritu:"Mandala",pers:"Siddharta (Buda)"}
};
const de=n=>/^[AEIOUH]/i.test(n)?"de l'":"del ";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.getElementById(s);
let AC;function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const notes=ok?[523,659,784]:[220,180];notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();
 o.frequency.value=f;o.type=ok?"triangle":"square";g.gain.setValueAtTime(.12,AC.currentTime+i*.1);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+i*.1+.18);o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.1);o.stop(AC.currentTime+i*.1+.2)})}catch(e){}}

const N=10;let qs=[],n=0,stars=0;
function build(){
  const all=[];
  R.forEach(r=>CATS.forEach(c=>{const v=D[r.id][c.k];if(v)all.push({r,c,v})}));
  return shuffle(all).slice(0,N).map((it,i)=>{
    if(i%2===0) return {type:"which",...it};               // "A quina religió pertany X?"
    const others=shuffle(R.filter(x=>x.id!==it.r.id&&D[x.id][it.c.k])).slice(0,2).map(x=>D[x.id][it.c.k]);
    return {type:"what",...it,opts:shuffle([it.v,...others])}; // "Quin és el temple del Judaisme?"
  });
}
function moveTrain(){const t=$("train"),tr=t.parentElement;const max=tr.clientWidth-t.clientWidth-80;
  t.style.left=(6+max*stars/N)+"px"}
function start(){qs=build();n=0;stars=0;moveTrain();show()}
function show(){
  const s=$("stage");$("score").textContent=`Pregunta ${n+1} de ${N} · ★ ${stars}`;
  const q=qs[n];let h='<div style="display:flex;flex-direction:column;gap:12px"><div class="card">';
  h+=`<div class="cat">${q.c.nom}</div>`;
  if(q.type==="which"){
    h+=`<p class="q">A quina religió pertany…</p><div class="word">${q.v}</div>`;
    h+='<div class="fb" id="fb"></div></div><div class="answers">';
    R.forEach(r=>h+=`<button class="ans" style="--c:${r.c}" data-v="${r.id}"><span class="ic">${r.ic}</span>${r.nom}</button>`);
  }else{
    h+=`<p class="q">${q.c.q} ${de(q.r.nom)}</p><div class="word" style="color:${q.r.c}">${q.r.ic} ${q.r.nom}?</div>`;
    h+='<div class="fb" id="fb"></div></div><div class="answers">';
    q.opts.forEach(o=>h+=`<button class="ans" data-v="${o}">${o}</button>`);
  }
  s.innerHTML=h+'</div></div>';
  s.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
  const q=qs[n],good=q.type==="which"?q.r.id:q.v,ok=b.dataset.v===good,fb=$("fb");
  document.querySelectorAll(".ans").forEach(x=>{x.disabled=true;if(x.dataset.v===good)x.classList.add("right")});
  if(ok){stars++;fb.className="fb ok";fb.textContent=["Molt bé!","Genial!","Correcte!","Xiu-xiu! El tren avança!"][Math.random()*4|0];moveTrain()}
  else{b.classList.add("wrong");fb.className="fb bad";
    fb.textContent=q.type==="which"?`És ${de(q.r.nom)}${q.r.nom}`:`Era: ${q.v}`}
  beep(ok);$("score").textContent=`Pregunta ${n+1} de ${N} · ★ ${stars}`;
  setTimeout(()=>{n++;n<N?show():end()},ok?1100:2200);
}
function end(){
  const msg=stars>=9?"Ets el maquinista campió!":stars>=6?"Molt bon viatge!":"Tornem a pujar al tren?";
  $("score").textContent=`Final · ★ ${stars} de ${N}`;
  $("stage").innerHTML=`<div class="card end"><div class="cat">HAS ARRIBAT A L'ESTACIÓ</div>
   <div class="stars">${"★".repeat(Math.round(stars/2))}${"☆".repeat(5-Math.round(stars/2))}</div>
   <div class="word">${stars} de ${N}</div><p class="q">${msg}</p>
   <button class="big" id="again">Tornar a jugar</button></div>`;
  $("again").onclick=start;
}

/* review table */
function table(){
  let h='<thead><tr><th style="background:none"></th>'+R.map(r=>`<th style="background:${r.c}">${r.ic}<br>${r.nom}</th>`).join("")+'</tr></thead><tbody>';
  CATS.forEach(c=>{h+=`<tr><th>${c.nom}</th>`+R.map(r=>{const v=D[r.id][c.k];return v?`<td class="hide" tabindex="0">${v}</td>`:'<td>—</td>'}).join("")+'</tr>'});
  $("tbl").innerHTML=h+'</tbody>';
  $("tbl").querySelectorAll("td.hide").forEach(td=>{const f=()=>td.classList.remove("hide");td.onclick=f;td.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")f()}});
}
$("tapa").onclick=table;
function tab(which){["joc","vag","taula"].forEach(k=>{$(k).hidden=which!==k;$("tab-"+k).setAttribute("aria-pressed",which===k)});
  if(which==="joc")moveTrain();if(which==="vag")window.vInit()}
$("tab-joc").onclick=()=>tab("joc");$("tab-vag").onclick=()=>tab("vag");$("tab-taula").onclick=()=>tab("taula");
window.addEventListener("resize",moveTrain);
table();start();
</script>

 o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.18)})}catch(e){}}
function whistle(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
 o.frequency.value=587;o2.frequency.value=740;o.type=o2.type="sine";g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.08);
 g.gain.setValueAtTime(.12,t+.7);g.gain.exponentialRampToValueAtTime(.0001,t+1);o.connect(g);o2.connect(g);g.connect(AC.destination);
 o.start(t);o2.start(t);o.stop(t+1);o2.stop(t+1)}catch(e){}}

let cur=0,score=0,done=new Set(),cards=[],sel=null;
function rounds(){
  $("vRounds").innerHTML=CATS.map((c,i)=>`<button class="rb${done.has(i)?" done":""}" aria-current="${i===cur}" data-i="${i}">${done.has(i)?"✓ ":""}${c.nom}</button>`).join("");
  $("vRounds").querySelectorAll(".rb").forEach(b=>b.onclick=()=>load(+b.dataset.i));
}
function load(i){
  cur=i;sel=null;const c=CATS[i];rounds();
  $("vTask").innerHTML=`Carrega ${c.t} al tren correcte`;
  $("vFb").textContent="";$("vFb").className="vfb";
  let items=[];
  R.forEach(r=>{const ks=c.k==="tot"?Object.keys(D[r.id]):[c.k];ks.forEach(k=>{if(D[r.id][k])items.push({r:r.id,v:D[r.id][k]})})});
  items=shuffle(items);if(c.k==="tot")items=items.slice(0,10);
  cards=items;
  const need={};items.forEach(it=>need[it.r]=(need[it.r]||0)+1);
  $("vStation").innerHTML=R.map(r=>`<div class="plat" tabindex="0" role="button" aria-label="Tren ${de(r.nom)}${r.nom}" data-r="${r.id}" style="--c:${r.c}">
    <div class="loco"><div class="cab"></div><div class="body"></div><div class="ic">${r.ic}</div></div>
    <div class="name">${r.nom}</div>
    <div class="wagons">${Array.from({length:need[r.id]||0},()=>'<span class="wagon">?</span>').join("")||'<span class="wagon" style="border-style:solid;opacity:.5">buit</span>'}</div></div>`).join("");
  $("vDock").innerHTML=items.map((it,j)=>`<button class="crate" data-j="${j}">${it.v}</button>`).join("");
  $("vStation").querySelectorAll(".plat").forEach(p=>{
    p.onclick=()=>{if(sel!==null)drop(sel,p.dataset.r)};
    p.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&sel!==null){e.preventDefault();drop(sel,p.dataset.r)}};
  });
  $("vDock").querySelectorAll(".crate").forEach(bindCrate);
}
function select(j){sel=j;document.querySelectorAll(".crate").forEach(c=>c.classList.toggle("sel",+c.dataset.j===j));
  document.querySelectorAll(".plat").forEach(p=>p.classList.add("pick"))}
function unselect(){sel=null;document.querySelectorAll(".crate").forEach(c=>c.classList.remove("sel"));document.querySelectorAll(".plat").forEach(p=>p.classList.remove("pick","hover"))}
function drop(j,rid){
  const it=cards[j],btn=document.querySelector(`.crate[data-j="${j}"]`),r=R.find(x=>x.id===rid),fb=$("vFb");
  if(!btn)return;
  if(it.r===rid){
    const w=document.querySelector(`.plat[data-r="${rid}"] .wagon:not(.full)`);w.classList.add("full");w.textContent=it.v;
    btn.remove();score++;$("vScore").textContent="★ "+score;tone(true);
    fb.className="vfb ok";fb.textContent=["Molt bé!","Carregat!","Correcte!","Perfecte!"][Math.random()*4|0];
    unselect();
    if(!document.querySelector(".crate"))finish();
  }else{
    const ok=R.find(x=>x.id===it.r);tone(false);
    btn.classList.remove("shake");void btn.offsetWidth;btn.classList.add("shake");
    fb.className="vfb bad";fb.textContent=`Aquest no és el tren. Pensa-hi: ${it.v} no és ${de(r.nom)}${r.nom}.`;
    unselect();
  }
}
function finish(){
  done.add(cur);rounds();whistle();
  $("vFb").className="vfb ok";$("vFb").textContent="Tots els trens plens! Xiu-xiu, marxem!";
  document.querySelectorAll(".plat").forEach((p,i)=>setTimeout(()=>p.classList.add("go"),i*180));
  const next=CATS.findIndex((c,i)=>!done.has(i));
  setTimeout(()=>{
    $("vDock").innerHTML=next>=0
      ?`<button class="vbig" id="nx">Següent: ${CATS[next].nom.toLowerCase()} →</button>`
      :`<div style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center"><div style="font-size:2rem;font-weight:700">Ets el cap d'estació!</div><button class="vbig" id="nx">Tornar a començar</button></div>`;
    $("nx").onclick=()=>{if(next<0){done.clear();load(0)}else load(next)};
  },1400);
}
/* drag with pointer, tap to select */
function bindCrate(b){
  const j=+b.dataset.j;
  b.addEventListener("pointerdown",e=>{
    if(e.button>0)return;
    const sx=e.clientX,sy=e.clientY,rect=b.getBoundingClientRect();let clone=null,over=null;
    b.setPointerCapture(e.pointerId);
    const move=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!clone&&Math.hypot(dx,dy)>8){clone=b.cloneNode(true);clone.classList.add("drag");clone.style.width=rect.width+"px";document.body.appendChild(clone);b.classList.add("ghost")}
      if(clone){clone.style.left=(rect.left+dx)+"px";clone.style.top=(rect.top+dy)+"px";
        const el=document.elementFromPoint(ev.clientX,ev.clientY),p=el&&el.closest(".plat");
        if(over&&over!==p)over.classList.remove("hover");over=p;if(p)p.classList.add("hover")}
    };
    const up=ev=>{
      b.removeEventListener("pointermove",move);b.removeEventListener("pointerup",up);b.removeEventListener("pointercancel",up);
      if(clone){clone.remove();b.classList.remove("ghost");if(over){over.classList.remove("hover");drop(j,over.dataset.r)}}
      else{sel===j?unselect():select(j)}
    };
    b.addEventListener("pointermove",move);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);
  });
  b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();sel===j?unselect():select(j)}});
}
window.vInit=()=>{if(!window.vReady){window.vReady=1;load(0)}};

})();
</script>

</body></html>
