<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The English Express · Review game</title>
<style>
  :root{--ink:#1d2340;--ok:#2e9d5b;--bad:#d9534f;--accent:#5b5bd6}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(160deg,#fff4d6,#ffe0ec);min-height:100vh;color:var(--ink)}
  header{text-align:center;padding:18px 12px 0}
  h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem)}
  .sub{margin:4px 0 0;opacity:.75}
  .yard{max-width:900px;margin:16px auto 0;padding:0 14px;overflow:hidden}
  .consist{display:flex;align-items:flex-end;gap:4px;min-height:84px;border-bottom:8px solid #6b4f3a;padding-bottom:4px;transition:transform 2.5s ease-in}
  .consist.leave{transform:translateX(120%)}
  .loco{font-size:3rem;transform:scaleX(-1);line-height:1}
  .wagon{width:58px;height:46px;border-radius:8px;background:#e6e6f5;border:3px dashed #b9b9d9;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
  .wagon.full{background:#ffd166;border:3px solid #e0a800;animation:pop .4s}
  @keyframes pop{50%{transform:scale(1.2)}}
  main{max-width:640px;margin:16px auto 30px;padding:0 14px}
  .card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.12);text-align:center}
  .tag{display:inline-block;background:#ececff;color:var(--accent);padding:4px 12px;border-radius:99px;font-size:.85rem;font-weight:bold}
  .pic{font-size:4rem;margin:8px 0 0}
  .q{font-size:clamp(1.2rem,4vw,1.6rem);margin:8px 0 16px}
  .say{font:inherit;background:none;border:2px solid #d5d5ef;border-radius:99px;padding:4px 12px;cursor:pointer;margin-bottom:12px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.opt{font:inherit;font-size:1.15rem;padding:14px;border-radius:14px;border:3px solid #d5d5ef;background:#fafaff;cursor:pointer;transition:.15s}
  button.opt:hover{border-color:var(--accent);transform:translateY(-2px)}
  button.opt.ok{background:#e3f7ea;border-color:var(--ok)}
  button.opt.bad{background:#fdecea;border-color:var(--bad);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .msg{min-height:1.6em;margin-top:12px;font-weight:bold}
  .go{font:inherit;font-size:1.2rem;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 26px;cursor:pointer;margin-top:12px}
  .stars{font-size:2rem;letter-spacing:4px}
  footer{text-align:center;font-size:.8rem;opacity:.6;padding-bottom:20px}
</style>
</head>
<body>
<header>
  <h1>🚂 The English Express</h1>
  <p class="sub">Every right answer adds a wagon. Fill the train and it leaves the station!</p>
</header>

<div class="yard"><div class="consist" id="consist"><div class="loco">🚂</div></div></div>
<main><div class="card" id="card"></div></main>
<footer>Demo review game · Homemade with love</footer>

<script>
// [picture, question, right answer, wrong answers, word to load into the wagon]
const Q = [
  ["🐘","What animal is this?","an elephant",["a giraffe","a lion","a monkey"],"🐘"],
  ["🦒","The giraffe has a very long ___.","neck",["tail","nose","ear"],"🦒"],
  ["🌧️","What's the weather like?","It's raining.",["It's sunny.","It's snowing.","It's windy."],"☔"],
  ["🪥","Every morning I ___ my teeth.","brush",["wash","eat","comb"],"🪥"],
  ["🕒","What time is it?","It's three o'clock.",["It's two o'clock.","It's five o'clock.","It's nine o'clock."],"🕒"],
  ["🔥","The opposite of hot is ___.","cold",["big","fast","happy"],"🧊"],
  ["🍎🍎🍎","How many apples are there?","three apples",["two apples","four apples","one apple"],"🍎"],
  ["🚉","She ___ the train to school every day.","takes",["take","taking","took"],"🚉"]
];

const consist=document.getElementById("consist"), card=document.getElementById("card");
let i=0, mistakes=0, order=[];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function speak(t){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace("___","blank"));
       u.lang="en-GB"; u.rate=.9; speechSynthesis.speak(u);}catch(e){}
}

function start(){
  i=0; mistakes=0; order=shuffle(Q);
  consist.classList.remove("leave");
  consist.innerHTML='<div class="loco">🚂</div>'+Q.map(()=>'<div class="wagon"></div>').join("");
  card.innerHTML=`<div class="pic">🎟️</div><p class="q">All aboard!<br>Answer 8 questions to fill the train.</p>
  <button class="go" onclick="ask()">Start ▶</button>`;
}

function ask(){
  const [pic,q,right,wrong]=order[i];
  card.innerHTML=`<span class="tag">Wagon ${i+1} of ${Q.length}</span>
  <div class="pic">${pic}</div><p class="q">${q}</p>
  <button class="say" onclick="speak(order[i][1])">🔊 Listen</button>
  <div class="opts"></div><div class="msg" id="msg"></div>`;
  const box=card.querySelector(".opts");
  shuffle([right,...wrong]).forEach(o=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=o;
    b.onclick=()=>answer(b,o===right,o); box.appendChild(b);
  });
}

function answer(b,ok,word){
  const msg=document.getElementById("msg");
  if(!ok){ mistakes++; b.classList.add("bad"); b.disabled=true; msg.style.color="var(--bad)"; msg.textContent="Oops! Try again 💪"; return; }
  speak(word);
  b.classList.add("ok"); card.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  msg.style.color="var(--ok)"; msg.textContent=["Great job! ⭐","Well done! ⭐","Brilliant! ⭐","Super! ⭐"][i%4];
  const w=consist.querySelectorAll(".wagon")[i]; w.classList.add("full"); w.textContent=order[i][4];
  setTimeout(()=>{ i++; i<Q.length?ask():finish(); },1100);
}

function finish(){
  const stars=mistakes===0?3:mistakes<=3?2:1;
  card.innerHTML=`<div class="pic">🎉</div><p class="q">The train is full!<br>Next stop: <b>Super English Station</b></p>
  <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div><p>Mistakes: ${mistakes}</p>
  <button class="go" onclick="start()">Play again 🔁</button>`;
  speak("The train is full! Choo choo!");
  setTimeout(()=>consist.classList.add("leave"),600);
}
start();
</script>
</body>
</html>
